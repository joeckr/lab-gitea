services:
  postgres:
    container_name: gitea-postgres
    image: ghcr.io/joeckr/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-localdevpostgres}"
    volumes:
      - postgres-data:/tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gitea:
    container_name: gitea
    image: docker.gitea.com/gitea:1.23.7-rootless
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: "http://localhost:3000/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: "postgres:5432"
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: "${POSTGRES_PASSWORD:-localdevpostgres}"
      GITEA__database__SSL_MODE: disable
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
    driver: local
  gitea-data:
    driver: local
  gitea-config:
    driver: local
