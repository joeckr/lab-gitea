apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gitea.name }}
  labels:
    {{- include "lab-gitea.labels" . | nindent 4 }}
    {{- include "lab-gitea.gitea.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gitea.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lab-gitea.gitea.selectorLabels" . | nindent 4 }}
{{- if .Values.gitea.ssh.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gitea.name }}-ssh
  labels:
    {{- include "lab-gitea.labels" . | nindent 4 }}
    {{- include "lab-gitea.gitea.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.gitea.ssh.serviceType }}
  ports:
    - port: {{ .Values.gitea.ssh.servicePort }}
      targetPort: ssh
      protocol: TCP
      name: ssh
  selector:
    {{- include "lab-gitea.gitea.selectorLabels" . | nindent 4 }}
{{- end }}
