# Name of an existing Kubernetes Secret created at install time (never committed to git).
# See scripts/create-secrets.sh for generating and applying this Secret.
existingSecret: "gitea-secrets"

# Keys expected inside existingSecret. Override if using ExternalSecrets / SealedSecrets
# with different key names.
secretKeys:
  dbPassword: "db-password"  # betterleaks:allow
  secretKey: "secret-key"
  internalToken: "internal-token"
  jwtSecret: "jwt-secret"
  oidcClientId: "oidc-client-id"
  oidcClientSecret: "oidc-client-secret"

gitea:
  name: gitea
  image: docker.gitea.com/gitea
  tag: "1.23.7-rootless"
  pullPolicy: IfNotPresent
  replicaCount: 1

  # Public hostname and URL served via Traefik Gateway + Cloudflare Tunnel
  domain: "gitea.joeckr.dev"
  rootUrl: "https://gitea.joeckr.dev/"
  httpPort: 3000

  # Optional Git-over-SSH exposure (disabled by default when using Cloudflare Tunnel HTTP/HTTPS)
  ssh:
    enabled: false
    port: 2222
    servicePort: 22
    serviceType: ClusterIP

  storage:
    size: 30Gi
    accessMode: ReadWriteOnce
    storageClass: "longhorn"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Hardened pod security context compliant with Kubernetes restricted PSS
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Hardened container security context compliant with Kubernetes restricted PSS
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  # Non-secret Gitea app.ini configuration
  config:
    appName: "Gitea"
    disableRegistration: false
    allowOnlyExternalRegistration: true
    showRegistrationButton: false
    enableOpenidSignin: false
    enableOpenidSignup: false
    oauth2EnableAutoRegistration: true
    oauth2AccountLinking: "auto"
    oauth2UpdateAvatar: true
    defaultTheme: "gitea-auto"
    logLevel: "Info"
    extraEnv: []

# Generic OIDC authentication source auto-configured via Gitea CLI on startup
oidc:
  enabled: true
  name: "Zitadel"
  # Full OIDC discovery URL (non-secret; client ID and secret live in existingSecret)
  autoDiscoverUrl: "https://zitadel.joeckr.dev/.well-known/openid-configuration"
  scopes: "openid email profile"
  groupClaimName: ""
  adminGroup: ""
  restrictedGroup: ""
  skipLocal2fa: true

# PostgreSQL backend using https://github.com/joeckr/oci-postgres
postgres:
  enabled: true
  name: gitea-postgres
  image: ghcr.io/joeckr/postgres
  tag: "18"
  pullPolicy: IfNotPresent
  port: 5432
  db: gitea
  user: gitea

  storage:
    size: 30Gi
    accessMode: ReadWriteOnce
    storageClass: "longhorn"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # oci-postgres runs rootless with PGDATA=/tmp/data and group 0 write permissions
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1031
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# External PostgreSQL connection details (used only when postgres.enabled is false)
externalPostgres:
  host: ""
  port: 5432
  db: gitea
  user: gitea
  sslMode: "require"

# Kubernetes Gateway API HTTPRoute for Traefik Gateway + Cloudflare Tunnel
gateway:
  enabled: true
  name: gitea-httproute
  annotations: {}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: gateway
      sectionName: web
  hostnames:
    - "gitea.joeckr.dev"

# Optional standard Kubernetes Ingress fallback (disabled by default; use gateway instead)
ingress:
  enabled: false
  name: gitea-ingress
  className: "traefik"
  host: "gitea.joeckr.dev"
  path: /
  pathType: "Prefix"
  annotations: {}
  tls: []
